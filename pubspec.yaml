name: professeur_cesu
description: Application de gestion de cours pour professeur à domicile CESU
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.0
  go_router: ^14.8.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  local_auth: ^2.3.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.28.0
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true